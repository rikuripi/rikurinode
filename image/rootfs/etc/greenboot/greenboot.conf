# greenboot: the boot health check that rolls an update back.
# Replaces Fedora IoT's file. Record: docs/build-records/2026-10-12-stage1-os-image.md
#
# greenboot reads this file as INI and falls back to its defaults, silently,
# when it cannot: no [section] headers, one KEY=VALUE per line.
# image/check_image_root.py holds these values.

GREENBOOT_MAX_BOOT_ATTEMPTS=3

# Fedora's DNS check would fail the boot, and after four boots roll a good
# update back, whenever the internet or the ISP is down (owner, 2026-10-12).
# The node's own required checks replace it.
# Fedora's update-platforms check tests Fedora's ostree servers, which a node
# never updates from (it follows its container image); without a route to
# them it logs a failed wanted check every boot, which buries a real one
# (owner, 2026-10-24).
DISABLED_HEALTHCHECKS=("01_repository_dns_check.sh" "01_update_platforms_check.sh")
