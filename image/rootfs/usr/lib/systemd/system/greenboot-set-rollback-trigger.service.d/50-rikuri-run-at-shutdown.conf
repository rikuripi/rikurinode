# greenboot sets its rollback trigger in this unit's ExecStop=, but the unit
# has DefaultDependencies=no: systemd stops it at shutdown only when another
# unit's ordering happens to (a separate /boot partition's mount). On the
# layout bootc install makes, /boot has no mount unit, the trigger is never
# set, and a broken update stays in place (greenboot-rs #218, reproduced by
# the CI drill). Conflicting with and preceding final.target, as ostree's own
# ostree-finalize-staged.service does, stops it at every shutdown; its
# After=ostree-finalize-staged.service still stops it before finalize.
# Record: docs/build-records/2026-10-22-greenboot-218.md
[Unit]
Conflicts=final.target
Before=final.target
