# Before greenboot reads its rollback trigger, clear it if the update it names
# was never applied (D22; greenboot-rs #219). The leading "-" keeps greenboot's
# own behaviour if this check fails: an unknown state counts against the update.
# Record: docs/build-records/2026-10-22-d22-unapplied-update.md
[Service]
ExecStartPre=-/usr/libexec/rikuri/greenboot-unapplied-update
