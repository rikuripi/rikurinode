# Rikuri Node: systemd-resolved answers the node's name, rikurisetup.local,
# over mDNS on UDP 5353, so a browser on the LAN finds it without an address.
# resolved answers on each link with that link's own addresses: the LAN never
# receives a container bridge's (the lessons register's PLAT-01). LLMNR stays
# off in its own file. Checked by image/check_image_root.py.
# Record: docs/build-records/2026-11-10-5c2-names-and-mdns.md
[Resolve]
MulticastDNS=yes
