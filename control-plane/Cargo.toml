# The control plane's workspace (plan §3.2, ADR 0002): one library crate that
# holds the logic and one binary crate that runs it. Direct dependencies are
# pinned exactly and Cargo.lock is committed; the gate builds with --locked.
# Record: docs/build-records/2026-10-12-b0-1-control-plane-workspace.md

[workspace]
resolver = "3"
members = ["crates/rikuri-control", "apps/rikuri-control-plane"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
http-body-util = "=0.1.5"
rikuri-control = { path = "crates/rikuri-control" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.2", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "=0.5.3", features = ["util"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Panicking shortcuts and debug output are build failures in shipped code
# (clippy.toml allows unwrap and expect inside tests). Logging goes through
# tracing, never println.
[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
