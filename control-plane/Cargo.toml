# The control plane's workspace (plan §3.2, ADR 0002): one library crate that
# holds the logic and one binary crate that runs it. Direct dependencies are
# pinned exactly and Cargo.lock is committed; the gate builds with --locked.
# Records: docs/build-records/2026-10-12-b0-1-control-plane-workspace.md (B0.1),
# docs/build-records/2026-10-19-b0-2-sign-in.md (B0.2: TLS, the claim, sign-in).

[workspace]
resolver = "3"
members = ["crates/rikuri-control", "apps/rikuri-control-plane"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64ct = { version = "=1.8.3", features = ["alloc"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "server-graceful"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
rikuri-control = { path = "crates/rikuri-control" }
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "=1.15.1"
secrecy = { version = "=0.10.3", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
subtle = { version = "=2.6.1", default-features = false }
time = { version = "=0.3.55", default-features = false, features = ["std"] }
tokio = { version = "=1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = { version = "=0.5.3", features = ["util"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Panicking shortcuts and debug output are build failures in shipped code
# (clippy.toml allows unwrap and expect inside tests). Logging goes through
# tracing, never println.
[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
# The no-process-spawn ban of clippy.toml, at `forbid` so that no #[allow] or
# #[expect] in the source can switch it off (ADR 0005, ADR 0014).
# Record: docs/build-records/2026-10-20-no-process-spawn.md
disallowed_methods = "forbid"
disallowed_types = "forbid"

# argon2id at its real cost (19 MiB, two passes) is what the node runs; an
# unoptimized build of it makes every test that hashes a password take a
# second, and the verifier's mutation run hundreds of them. The hashing crates
# alone are optimized in dev and test builds; nothing else changes.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
