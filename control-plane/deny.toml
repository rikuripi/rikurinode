# cargo-deny policy (plan §3.8, supply chain): licences, advisories, bans and
# sources, run by scripts/quality/full-gate.sh locally and in CI with the
# pinned cargo-deny. Record: docs/build-records/2026-10-12-b0-1-control-plane-workspace.md

[graph]
# The two nodes. Crates pulled in only on other platforms are not audited.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
# Every RustSec advisory fails the gate. An entry in `ignore` needs a reason,
# an owner and a removal date in the Build Record that adds it.
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
# Permissive licences only, and only those the tree uses: adding one is a
# reviewed change, and an unused allowance is reported.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    # ISC: ring's `untrusted` and `rustls-webpki` (B0.2, 2026-10-19). Permissive,
    # functionally MIT; added for those crates, not as a general allowance.
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[licenses.private]
# The workspace's own crates are unpublished and carry no licence field.
ignore = true

[bans]
# Two versions of one crate fail the gate unless skipped here with a reason:
# a duplicate is a deliberate, dated exception, never background noise.
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    # Compile-time only (proc-macro crates): tracing-attributes 0.1.31 still
    # builds on syn 2 while serde_derive 1.0.229 and tokio-macros 2.7.2 moved
    # to syn 3. Remove when tracing-attributes moves (B0.1, 2026-10-12).
    { crate = "syn@2.0.119", reason = "tracing-attributes 0.1.31 is still on syn 2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
