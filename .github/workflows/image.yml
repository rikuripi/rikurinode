name: OS image

# Builds the node's OS image (image/Containerfile) and checks it. bootc's own
# lint runs inside the build; image/check_image_root.py checks the built
# root against what the node relies on (lessons register PLAT-01). The node and
# this machine never build it: the image exists only here.
# The drill job boots the image in a KVM VM and runs the rollback drill (stage 1
# changes 3 and 4; image/drill/vm_drill.py): on image changes and weekly
# (owner, 2026-10-12). Not yet: signing and publishing (change 2).
# Records: docs/build-records/2026-10-12-stage1-os-image.md,
# docs/build-records/2026-10-22-ci-vm-drill.md

on:
  # Every pull request starts the workflow, so its jobs can be required checks;
  # the changes job skips the build and the drill when neither image/ nor this
  # file changed (a skipped job counts as passed).
  # Record: docs/build-records/2026-10-22-image-workflow-every-pr.md
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ["image/**", ".github/workflows/image.yml"]
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC: the drill against the pinned base
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The release image/Containerfile's base must be; the check fails otherwise.
  FEDORA_RELEASE: "44"
  IMAGE: localhost/rikuri-os:ci

jobs:
  changes:
    name: Did the image or its workflow change?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide (only a pull request that touches neither may skip)
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          image=true
          if [ "$EVENT" != "pull_request" ]; then
            reason="$EVENT: everything runs"
          elif ! changed="$(git diff --name-only "$BASE" HEAD)"; then
            reason="the diff against $BASE could not be read: everything runs"
          elif grep -qE '^(image/|\.github/workflows/image\.yml$)' <<< "$changed"; then
            reason="the pull request changes image/ or this workflow"
          else
            image=false
            reason="the pull request changes neither image/ nor this workflow: build and drill skipped"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "### Changes: image=$image ($reason)" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and check the OS image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe - can this runner run a VM? (the drill job needs it; reports, never fails)
        run: |
          {
            echo "### Runner probe"
            if [ -e /dev/kvm ]; then
              echo "- /dev/kvm: present ($(ls -l /dev/kvm))"
            else
              echo "- /dev/kvm: ABSENT"
            fi
            echo "- CPUs: $(nproc); memory: $(free -m | awk '/^Mem:/{print $2}') MiB"
            echo "- free on /: $(df -h --output=avail / | tail -1 | tr -d ' '); on /mnt: $(df -h --output=avail /mnt | tail -1 | tr -d ' ')"
            echo "- $(podman --version); $(python3 --version)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build (bootc container lint runs inside)
        run: sudo podman build --pull=missing --tag "$IMAGE" image
      - name: Check the built root
        run: |
          root="$(sudo podman image mount "$IMAGE")"
          sudo python3 image/check_image_root.py "$root" --fedora "$FEDORA_RELEASE"
          sudo podman image unmount "$IMAGE"
      - name: Record what was built
        if: always()
        run: |
          {
            echo "### Built"
            sudo podman image inspect --format '- image: {{.Id}}, {{.Size}} bytes, created {{.Created}}' "$IMAGE" || echo "- no image"
            sudo podman image inspect --format '- base: {{index .Labels "org.opencontainers.image.version"}}' "$IMAGE" || true
          } | tee -a "$GITHUB_STEP_SUMMARY"

  drill:
    name: Boot the image in a VM and run the rollback drill
    needs: [changes, build]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install QEMU and UEFI firmware (Ubuntu 24.04's archive; versions recorded)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf
          {
            echo "### VM tools"
            dpkg-query -W -f='- ${Package} ${Version}\n' qemu-system-x86 ovmf
            echo "- /dev/kvm: $(ls -l /dev/kvm)"
            echo "- free on /mnt: $(df -h --output=avail /mnt | tail -1 | tr -d ' ')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the image (bootc container lint runs inside)
        run: sudo podman build --pull=missing --tag "$IMAGE" image
      - name: Run the drill (first boot; cases 1, 2b and 3)
        run: |
          sudo mkdir -p /mnt/drill
          sudo chown "$(id -u):$(id -g)" /mnt/drill
          python3 -I image/drill/vm_drill.py --image "$IMAGE" --workdir /mnt/drill --artifacts "$RUNNER_TEMP/drill-evidence"
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drill-evidence
          path: ${{ runner.temp }}/drill-evidence
          if-no-files-found: warn
          retention-days: 30
