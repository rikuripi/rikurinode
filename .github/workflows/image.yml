name: OS image

# Builds the node's OS image (image/Containerfile) and checks it. bootc's own
# lint runs inside the build; image/check_image_root.py checks the built
# root against what the node relies on (lessons register PLAT-01). The node and
# this machine never build it: the image exists only here.
# The drill job boots the image in a KVM VM and runs the rollback drill (stage 1
# changes 3 and 4; image/drill/vm_drill.py): on image changes and weekly
# (owner, 2026-10-12). The build job also proves the node's signature policy on
# the built image, with throwaway keys (change 2a; image/drill/signature_policy.py).
# Publishing and signing with the real key: publish.yml (change 2b). The drill
# also has the node's own bootc refuse an unsigned image and stage the first
# published, signed one, through a registry on the runner (change 2c).
# Records: docs/build-records/2026-10-12-stage1-os-image.md,
# docs/build-records/2026-10-22-ci-vm-drill.md,
# docs/build-records/2026-10-25-signature-policy.md,
# docs/build-records/2026-10-29-node-refuses-unsigned.md

on:
  # Every pull request starts the workflow, so its jobs can be required checks;
  # the changes job skips the build and the drill when neither image/ nor this
  # file changed (a skipped job counts as passed).
  # Record: docs/build-records/2026-10-22-image-workflow-every-pr.md
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ["image/**", ".github/workflows/image.yml"]
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC: the drill against the pinned base
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The release image/Containerfile's base must be; the check fails otherwise.
  FEDORA_RELEASE: "44"
  IMAGE: localhost/rikuri-os:ci
  # The signature proof's tools: release binaries, checked against these SHA-256
  # (GitHub's release asset digests, read 2026-10-28). Apache-2.0 both. Never a
  # REGISTRY_* name: the registry reads those as config (CI run 40776852353).
  COSIGN_VERSION: v3.1.4
  COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
  DISTRIBUTION_VERSION: 3.1.2
  DISTRIBUTION_SHA256: 40df2224d410f72ae425c3371873b078bbdbda3b8b612be9571f0e6751f3acc8

jobs:
  changes:
    name: Did the image or its workflow change?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide (only a pull request that touches neither may skip)
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          image=true
          if [ "$EVENT" != "pull_request" ]; then
            reason="$EVENT: everything runs"
          elif ! changed="$(git diff --name-only "$BASE" HEAD)"; then
            reason="the diff against $BASE could not be read: everything runs"
          elif grep -qE '^(image/|\.github/workflows/image\.yml$)' <<< "$changed"; then
            reason="the pull request changes image/ or this workflow"
          else
            image=false
            reason="the pull request changes neither image/ nor this workflow: build and drill skipped"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "### Changes: image=$image ($reason)" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and check the OS image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe - can this runner run a VM? (the drill job needs it; reports, never fails)
        run: |
          {
            echo "### Runner probe"
            if [ -e /dev/kvm ]; then
              echo "- /dev/kvm: present ($(ls -l /dev/kvm))"
            else
              echo "- /dev/kvm: ABSENT"
            fi
            echo "- CPUs: $(nproc); memory: $(free -m | awk '/^Mem:/{print $2}') MiB"
            echo "- free on /: $(df -h --output=avail / | tail -1 | tr -d ' '); on /mnt: $(df -h --output=avail /mnt | tail -1 | tr -d ' ')"
            echo "- $(podman --version); $(python3 --version)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build (bootc container lint runs inside)
        run: sudo podman build --pull=missing --tag "$IMAGE" image
      - name: Check the built root
        run: |
          root="$(sudo podman image mount "$IMAGE")"
          sudo python3 image/check_image_root.py "$root" --fedora "$FEDORA_RELEASE"
          sudo podman image unmount "$IMAGE"
      - name: Fetch the signature proof's tools (cosign, a registry; pinned by SHA-256)
        run: |
          mkdir "$RUNNER_TEMP/sig-tools"
          cd "$RUNNER_TEMP/sig-tools"
          curl -fsSL --retry 3 -o cosign \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          curl -fsSL --retry 3 -o registry.tar.gz \
            "https://github.com/distribution/distribution/releases/download/v$DISTRIBUTION_VERSION/registry_${DISTRIBUTION_VERSION}_linux_amd64.tar.gz"
          printf '%s  cosign\n%s  registry.tar.gz\n' "$COSIGN_SHA256" "$DISTRIBUTION_SHA256" | sha256sum --strict -c -
          tar xzf registry.tar.gz registry
          chmod +x cosign registry
          echo "### Signature proof's tools: cosign $COSIGN_VERSION, registry $DISTRIBUTION_VERSION (SHA-256 checked)" >> "$GITHUB_STEP_SUMMARY"
      - name: Prove the signature policy (the image's own skopeo and policy; throwaway keys, a registry on 127.0.0.1)
        run: |
          python3 -I image/drill/signature_policy.py --image "$IMAGE" \
            --cosign "$RUNNER_TEMP/sig-tools/cosign" --registry "$RUNNER_TEMP/sig-tools/registry" \
            --workdir "$RUNNER_TEMP/sig-proof"
      - name: Record what was built
        if: always()
        run: |
          {
            echo "### Built"
            sudo podman image inspect --format '- image: {{.Id}}, {{.Size}} bytes, created {{.Created}}' "$IMAGE" || echo "- no image"
            sudo podman image inspect --format '- base: {{index .Labels "org.opencontainers.image.version"}}' "$IMAGE" || true
          } | tee -a "$GITHUB_STEP_SUMMARY"

  drill:
    name: Boot the image in a VM and run the rollback drill
    needs: [changes, build]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install QEMU and UEFI firmware (Ubuntu 24.04's archive; versions recorded)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf
          {
            echo "### VM tools"
            dpkg-query -W -f='- ${Package} ${Version}\n' qemu-system-x86 ovmf
            echo "- /dev/kvm: $(ls -l /dev/kvm)"
            echo "- free on /mnt: $(df -h --output=avail /mnt | tail -1 | tr -d ' ')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the image (bootc container lint runs inside)
        run: sudo podman build --pull=missing --tag "$IMAGE" image
      - name: Fetch the drill's registry (cases 4 and 5; pinned by SHA-256)
        run: |
          mkdir "$RUNNER_TEMP/sig-tools"
          cd "$RUNNER_TEMP/sig-tools"
          curl -fsSL --retry 3 -o registry.tar.gz \
            "https://github.com/distribution/distribution/releases/download/v$DISTRIBUTION_VERSION/registry_${DISTRIBUTION_VERSION}_linux_amd64.tar.gz"
          printf '%s  registry.tar.gz\n' "$DISTRIBUTION_SHA256" | sha256sum --strict -c -
          tar xzf registry.tar.gz registry
          chmod +x registry
      - name: Run the drill (first boot; cases 1, 2b and 3; 4 and 5, the signature)
        run: |
          sudo mkdir -p /mnt/drill
          sudo chown "$(id -u):$(id -g)" /mnt/drill
          python3 -I image/drill/vm_drill.py --image "$IMAGE" --workdir /mnt/drill --artifacts "$RUNNER_TEMP/drill-evidence" \
            --registry "$RUNNER_TEMP/sig-tools/registry"
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drill-evidence
          path: ${{ runner.temp }}/drill-evidence
          if-no-files-found: warn
          retention-days: 30
